name: QA capturas precios
on:
  push:
    branches: [qa/precios-capturas]
jobs:
  shots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx vitest run qa-shots/render.test.tsx
      - run: npm i --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - run: node qa-shots/shoot.mjs
      - uses: actions/upload-artifact@v4
        with: { name: capturas, path: qa-shots/out/*.png }
